<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adam Grafis - Pemesanan</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="parallax-bg-glow">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <div id="pageLoader"><div class="spinner"></div></div>

  <header>
    <a href="index.html" class="brand">
      <i class="fa-solid fa-pen-nib" style="color: var(--accent-color);"></i>
      <span>Adam Grafis</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Beranda</a></li>
      <li><a href="portofolio.html">Portofolio</a></li>
      <li><a href="pemesanan.html" class="active">Pemesanan</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle"><i class="fa-solid fa-sun"></i></button>
  </header>

  <main class="page-container">
    <div class="bento-grid">
      
      <section class="bento-card bento-order-form">
        <h2 style="margin-bottom: 20px; font-size: 1.5rem;">Formulir Pemesanan Desain</h2>
        <form id="orderForm">
          <div class="form-group">
            <label for="clientName">Nama Lengkap / Pemesan</label>
            <input type="text" id="clientName" class="form-control" placeholder="Masukkan nama Anda" required>
          </div>

          <div class="form-group">
            <label for="orderCategory">Kategori Desain</label>
            <select id="orderCategory" class="form-control">
              <option value="spanduk">Spanduk / Banner (Rp 25.000 / Meter)</option>
              <option value="flyer">Flyer / Brosur (Rp 150.000 / Paket)</option>
              <option value="stage">Background Stage / Panggung (Rp 50.000 / Meter)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="orderSize">Jumlah / Ukuran (Meter/Pcs)</label>
            <input type="number" id="orderSize" class="form-control" value="1" min="1" required>
          </div>

          <div class="form-group">
            <label for="orderNotes">Catatan / Detail Konsep Desain</label>
            <textarea id="orderNotes" class="form-control" rows="4" placeholder="Tuliskan warna utama, teks spanduk, atau referensi konsep..."></textarea>
          </div>
        </form>
      </section>

      <section class="bento-card bento-order-summary">
        <h3 style="font-size: 1.2rem; color: var(--text-secondary);">Estimasi Biaya</h3>
        <div id="estimatedPrice" class="price-amount">Rp 0</div>
        <button type="button" id="sendWaBtn" class="btn-main btn-whatsapp" style="width: 100%; justify-content: center; margin-top: 16px;">
          <i class="fa-brands fa-whatsapp"></i> Kirim via WhatsApp
        </button>
      </section>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 Adam Grafis. Seluruh Hak Cipta Dilindungi.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
